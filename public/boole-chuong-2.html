<script>/* Boolean engine: no eval, exhaustive equivalence, exact prime-implicant cover. */
const Engine = (() => {
  function parse(source, vars) {
    const input = source.toUpperCase().replace(/\s/g,'').replace(/[¬~]/g,'!').replace(/[·&]/g,'*').replace(/[∨|]/g,'+').replace(/⊕/g,'^').replace(/[’′]/g,"'");
    const tokens = input.match(/[A-Z][0-9]*|[01]|[!+*^()']/g) || [];
    if (tokens.join('') !== input || !tokens.length) throw Error('Dùng biến của đề, 0, 1, !, +, *, ^ và dấu ngoặc.');
    let p = 0;
    function atom(){
      let t = tokens[p++], n;
      if(t==='!') n={op:'not',a:atom()};
      else if(t==='('){ n=or(); if(tokens[p++]!==')')throw Error('Thiếu dấu đóng ngoặc.'); }
      else if(t==='0'||t==='1') n={op:'const',v:+t};
      else if(vars.includes(t)) n={op:'var',v:t};
      else throw Error('Biến không hợp lệ: '+(t||'cuối biểu thức'));
      while(tokens[p]==="'"){p++;n={op:'not',a:n};}return n;
    }
    function and(){let n=atom();while(tokens[p]==='*'||(tokens[p]&&![')',"'",'+','^'].includes(tokens[p]))){if(tokens[p]==='*')p++;n={op:'and',a:n,b:atom()};}return n;}
    function xor(){let n=and();while(tokens[p]==='^'){p++;n={op:'xor',a:n,b:and()};}return n;}
    function or(){let n=xor();while(tokens[p]==='+'){p++;n={op:'or',a:n,b:xor()};}return n;}
    const n=or();if(p!==tokens.length)throw Error('Kiểm tra lại toán tử và dấu ngoặc.');return n;
  }
  function evaluate(n,env){switch(n.op){case'var':return env[n.v];case'const':return n.v;case'not':return 1-evaluate(n.a,env);case'and':return evaluate(n.a,env)&evaluate(n.b,env);case'or':return evaluate(n.a,env)|evaluate(n.b,env);case'xor':return evaluate(n.a,env)^evaluate(n.b,env);}}
  const bits=(i,n)=>i.toString(2).padStart(n,'0').split('').map(Number);
  const env=(i,vars)=>Object.fromEntries(vars.map((v,k)=>[v,bits(i,vars.length)[k]]));
  function truth(expr,vars){const tree=parse(expr,vars);return Array.from({length:2**vars.length},(_,i)=>evaluate(tree,env(i,vars)));}
  function minimize(values,vars,pos=false){
    const target=pos?0:1, required=values.flatMap((v,i)=>v===target?[i]:[]);
    if(!required.length)return {expr:pos?'1':'0',groups:[]};
    const candidates=[];
    function cubes(s){if(s.length<vars.length){for(const b of ['0','1','-'])cubes(s+b);return;}
      const cells=values.flatMap((v,i)=>bits(i,vars.length).every((b,k)=>s[k]==='-'||+s[k]===b)?[i]:[]);
      if(cells.some(i=>values[i]===1-target)||!cells.some(i=>values[i]===target))return;
      candidates.push({pattern:s,cells,cover:cells.filter(i=>values[i]===target),literals:s.replaceAll('-','').length});}
    cubes('');
    const primes=candidates.filter(c=>!candidates.some(d=>d.cells.length>c.cells.length&&c.cells.every(i=>d.cells.includes(i))));
    let best=null;const memo=new Map();
    function search(left,chosen,cost){
      if(!left.length){if(!best||chosen.length<best.length||chosen.length===best.length&&cost<best.cost){best=[...chosen];best.cost=cost;}return;}
      if(best&&chosen.length>=best.length)return;
      const key=left.join(','), old=memo.get(key);
      if(old&&(old[0]<chosen.length||old[0]===chosen.length&&old[1]<=cost))return;
      memo.set(key,[chosen.length,cost]);
      const i=left.reduce((a,b)=>primes.filter(c=>c.cover.includes(a)).length<=primes.filter(c=>c.cover.includes(b)).length?a:b);
      for(const c of primes.filter(c=>c.cover.includes(i)).sort((a,b)=>b.cover.length-a.cover.length||a.literals-b.literals)) search(left.filter(j=>!c.cover.includes(j)),[...chosen,c],cost+c.literals);
    }
    search(required,[],0);
    const groups=best.map(c=>({...c,term:c.pattern.split('').flatMap((b,k)=>b==='-'?[]:[(pos?(b==='1'):(b==='0'))?'!'+vars[k]:vars[k]]).join(pos?'+':'*')||(pos?'0':'1')}));
    return {expr:groups.map(c=>pos?'('+c.term+')':c.term).join(pos?'*':'+'),groups};
  }
  function canonical(values,vars,pos=false){const cells=values.flatMap((v,i)=>v===(pos?0:1)?[i]:[]);return cells.map(i=>{const term=bits(i,vars.length).map((b,k)=>(pos?b:!b)?'!'+vars[k]:vars[k]).join(pos?'+':'*');return pos?'('+term+')':term;}).join(pos?'*':'+')||(pos?'1':'0');}
  function mismatch(expr,task){const values=truth(expr,task.vars);return task.values.findIndex((v,i)=>v!=='X'&&v!==values[i]);}
  function network(expr,vars,mode='normal'){
    const nodes=[],cache=new Map();
    const add=(op,ins=[],label='')=>{const key=op+':'+ins.join(',')+':'+label;if(cache.has(key))return cache.get(key);const id=nodes.length;nodes.push({id,op,ins,label,depth:ins.length?1+Math.max(...ins.map(i=>nodes[i].depth)):0});cache.set(key,id);return id;};
    const type=mode.startsWith('nor')?'nor':'nand',only=mode!=='normal';
    const inv=a=>{const n=nodes[a];if(only&&n.op===type&&n.ins.length===2&&n.ins[0]===n.ins[1])return n.ins[0];if(!only&&n.op==='not')return n.ins[0];return add(only?type:'not',[a,...(only?[a]:[])]);};
    function make(n){if(n.op==='var')return add(n.op,[],String(n.v));if(n.op==='const'){if(!only)return add(n.op,[],String(n.v));const v=add('var',[],vars[0]),base=add(type,[v,inv(v)]);return n.v===(type==='nand'?1:0)?base:inv(base);}if(!only&&(n.op==='and'||n.op==='or')){const terms=[];function flatten(t){if(t.op===n.op){flatten(t.a);flatten(t.b);}else terms.push(make(t));}flatten(n);return add(n.op,terms);}const a=make(n.a);if(n.op==='not')return inv(a);const b=make(n.b);if(!only)return add(n.op,[a,b]);
      if(n.op==='and')return type==='nand'?inv(add('nand',[a,b])):add('nor',[inv(a),inv(b)]);
      if(n.op==='or')return type==='nor'?inv(add('nor',[a,b])):add('nand',[inv(a),inv(b)]);
      const t=add('nand',[a,b]);if(type==='nand')return add('nand',[add('nand',[a,t]),add('nand',[b,t])]);
      return add('nor',[add('nor',[a,b]),add('nor',[inv(a),inv(b)])]);
    }
    const output=make(parse(expr,vars)),reachable=new Set();function mark(id){if(reachable.has(id))return;reachable.add(id);nodes[id].ins.forEach(mark);}mark(output);const clean=[],ids=new Map();for(const n of nodes)if(reachable.has(n.id)){const id=clean.length,ins=n.ins.map(i=>ids.get(i));ids.set(n.id,id);clean.push({...n,id,ins,depth:ins.length?1+Math.max(...ins.map(i=>clean[i].depth)):0});}return {nodes:clean,output:ids.get(output)};
  }
  function simulate(net,input){const out=[];for(const n of net.nodes){const a=out[n.ins[0]],b=out[n.ins[1]];out.push(n.op==='var'?input[n.label]:n.op==='const'?+n.label:n.op==='not'?1-a:n.op==='and'?n.ins.reduce((v,i)=>v&out[i],1):n.op==='or'?n.ins.reduce((v,i)=>v|out[i],0):n.op==='xor'?a^b:n.op==='nand'?1-(a&b):1-(a|b));}return out;}
  return {parse,evaluate,bits,env,truth,minimize,canonical,mismatch,network,simulate};
})();
if(typeof module!=='undefined')module.exports=Engine;
</script><script>/* Transcribed from BTC2.pdf, chapter 2 only, printed pages 5–9. */
const LESSONS=[];
const V=s=>s.split(' ');
function exprTask(name,vars,expr,extra={}){vars=V(vars);return {name,vars,expr,values:Engine.truth(expr,vars),...extra};}
function setTask(name,vars,indices,dc=[],pos=false,extra={}){vars=V(vars);return {name,vars,values:Array.from({length:2**vars.length},(_,i)=>dc.includes(i)?'X':indices.includes(i)?(pos?0:1):(pos?1:0)),given:(pos?'ΠM':'Σm')+'('+indices.join(',')+')'+(dc.length?' ; d('+dc.join(',')+')':''),...extra};}
function lesson(id,title,category,page,request,insight,tasks,extra={}){const l={id,title,category,page,request,insight,tasks,...extra};LESSONS.push(l);return l;}
const proof=(name,vars,left,right,steps,question,options,correct)=>exprTask(name,vars,left,{right,proof:steps,question,options,correct});
lesson('2-1','Biến đổi đẳng thức','Đại số',5,'Chứng minh cả 5 đẳng thức bằng đại số. Bảng chân trị chỉ dùng để đối chiếu; phần chứng minh nằm ở chuỗi biến đổi.','Bắt đầu từ vế có cấu trúc dễ khai triển. Mỗi lần chỉ áp dụng một định luật; chú ý một vạch phủ cả ngoặc khác với phủ từng biến.',[
proof('a','A B C D','!A*B+!A*!D+B*!C*D','(!A+D)*(!A+!C)*(B+!D)',[
['Chọn vế phải','(!A+D)*(!A+!C)*(B+!D)','Hai ngoặc đầu cùng chứa !A. Dùng (x+y)(x+z)=x+yz.'],
['Gộp hai ngoặc','(!A+D*!C)*(B+!D)','Đặt x=!A, y=D, z=!C. Giữ nguyên ngoặc cuối.'],
['Phân phối','!A*B+!A*!D+D*!C*B+D*!C*!D','Nhân từng hạng trong ngoặc trái với từng hạng trong ngoặc phải.'],
['Triệt tiêu mâu thuẫn','!A*B+!A*!D+B*!C*D','D!D=0 nên hạng cuối mất. Ba hạng còn lại đúng bằng vế trái.']
],'Hạng D·!C·!D biến mất vì…',['D·!D = 0','D + !D = 0','D·D = 0'],0),
proof('b','A B C D','!C*D+!B*!C+!A*B*D','(!A+!C)*(B+!C)*(!B+D)',[
['Chọn vế phải','(!A+!C)*(B+!C)*(!B+D)','Đảo thứ tự các hạng để nhìn ra biến chung !C trong hai ngoặc đầu.'],
['Gộp ngoặc','(!C+!A*B)*(!B+D)','Dùng (x+y)(x+z)=x+yz với x=!C.'],
['Khai triển','!C*!B+!C*D+!A*B*!B+!A*B*D','Phân phối đủ bốn tích, chưa bỏ hạng nào.'],
['Dùng luật bù','!C*D+!B*!C+!A*B*D','B!B=0. Đổi thứ tự ba hạng còn lại thu được vế trái.']
],'Quy tắc gộp (x+y)(x+z) là…',['x+yz','xy+xz','x+y+z'],0),
proof('c','X Y Z','Z+X*Y+!X*Z','(X+Z)*(Y+Z)',[
['Bắt đầu từ vế trái','Z+X*Y+!X*Z','Z đã bao phủ mọi trường hợp !XZ=1.'],
['Hấp thụ','Z+X*Y','Z+!XZ=Z theo x+xy=x.'],
['Phân phối ngược','(Z+X)*(Z+Y)','Áp dụng x+yz=(x+y)(x+z).'],
['Sắp lại thứ tự','(X+Z)*(Y+Z)','OR có tính giao hoán. Hai vế đã trùng nhau.']
],'Vì sao bỏ được !XZ trong Z+XY+!XZ?',['Z hấp thụ !XZ','!XZ luôn bằng 0','XY luôn bằng 1'],0),
proof('d','A B','!(A^B)','!A^B',[
['Mở XOR','!(!A*B+A*!B)','A⊕B bằng 1 khi đúng một đầu vào bằng 1.'],
['De Morgan','(A+!B)*(!A+B)','Phủ tổng thành tích các phủ định.'],
['Phân phối','A*!A+A*B+!B*!A+!B*B','Hai tích chứa biến và phủ định của chính nó đều bằng 0.'],
['Nhận dạng XNOR','A*B+!A*!B','Đây là (!A)⊕B. Chú ý ! phủ toàn bộ XOR ở đề.']

const l22=lesson('2-2','Từ bảng đến biểu thức','Bảng chân trị',5,'a) Viết F1, F2. b) F1 dạng POS. c) F2 dạng SOP. d–e) Cả hai dạng Σ và Π.','Thứ tự cột của đề là C,B,A. Vì vậy i=4C+2B+A; đừng tự đổi sang A,B,C khi ghi chỉ số.',[

const l23=lesson('2-3','Hiểu đúng ô X','Bảng chân trị',5,'a) Viết biểu thức hai hàm. b) Viết Σ và Π, kèm tập d.','X ở cột đầu ra là don’t-care: không bị ép bằng 0 hoặc 1. Tập d phải tách riêng khỏi tập 1 và tập 0.',[

['Bìa K là bảng chân trị được sắp lại.','Mỗi ô ứng với đúng một bộ đầu vào. Số nhỏ là chỉ số minterm; số lớn là giá trị F. Bản đồ đang biểu diễn F(A,B,C,D) có 16 tổ hợp.','Bấm một ô: bạn sẽ thấy nó tương ứng với bộ ABCD nào.','Mục tiêu: gom các ô 1 để tìm biểu thức ngắn hơn.'],
['Vì sao 00 → 01 → 11 → 10?','Đây là thứ tự Gray: hai nhãn kề nhau chỉ đổi một bit. Ví dụ 01 → 11 chỉ đổi bit đầu. Nếu viết 00,01,10,11 thì 01 → 10 đổi cả hai bit, không thể khử một biến trực tiếp.','Chọn m0 và m2 ở hai mép: CD=00 và CD=10 chỉ khác C.','00 và 10 cũng kề nhau; bìa K nối vòng ở cả hai chiều.'],
['Một nhóm, một tích ngắn hơn.','Gom 1, 2, 4, 8 hoặc 16 ô thành hình chữ nhật. Trong nhóm, biến đổi giá trị sẽ bị khử; biến giữ nguyên sẽ ở lại. Nhóm 4 ô khử 2 biến.','Chọn m0, m2, m8, m10. A và C thay đổi, B=0 và D=0 giữ nguyên.','Một ô có thể thuộc nhiều nhóm. Cần phủ đủ mọi ô 1; tránh nhóm chứa ô 0.'],
['Bốn góc thật ra ở cạnh nhau.','Hãy tưởng tượng gập mép trái chạm mép phải, mép trên chạm mép dưới. Bốn ô góc là một nhóm 4 hợp lệ, không phải bốn nhóm rời.','Nhóm {0,2,8,10} → !B!D. Không gom chéo tùy ý; các ô phải tạo một khối đầy đủ trên bìa nối vòng.','Cả hai mép được nối. Với 5 biến, hai lớp có các ô cùng vị trí cũng kề nhau.'],
['Ô X giúp nới nhóm, khi có lợi.','X ở đầu ra là don’t-care: có thể chọn 0 hoặc 1. Ví dụ này có các ô 1 tại 1,3,7 và X tại 5. Dùng ô 5 sẽ tạo nhóm 4 thay vì hai nhóm 2.','Chọn {1,3,5,7}. A luôn 0 và D luôn 1 → !AD.','Không cần phủ tất cả X. X ở cột đầu vào của một hàng gộp lại mang nghĩa khác.'],

function groupInfo(t,cells,pos){
  if(!cells.length)return null;const b=cells.map(i=>Engine.bits(i,t.vars.length)),pattern=t.vars.map((_,k)=>b.every(x=>x[k]===b[0][k])?String(b[0][k]):'-').join('');
  const full=Array.from({length:t.values.length},(_,i)=>i).filter(i=>Engine.bits(i,t.vars.length).every((bit,k)=>pattern[k]==='-'||+pattern[k]===bit));
  if(full.length!==cells.length)return {valid:false,message:'Nhóm chưa tạo thành một khối đầy đủ. Chọn hình chữ nhật 1, 2, 4, 8,… ô; được nối qua mép.'};
  if(cells.some(i=>t.values[i]===(pos?1:0)))return {valid:false,message:'Nhóm chứa ô '+(pos?'1':'0')+'. '+(pos?'POS chỉ gom ô 0 và X.':'SOP chỉ gom ô 1 và X.')};
  if(!cells.some(i=>t.values[i]===(pos?0:1)))return {valid:false,message:'Nhóm toàn X chưa phủ thêm ô bắt buộc nào. Hãy thêm ít nhất một ô '+(pos?'0':'1')+'.'};
  const kept=pattern.split('').flatMap((v,i)=>v==='-'?[]:[(pos?v==='1':v==='0')?'!'+t.vars[i]:t.vars[i]]);
  return {valid:true,pattern,term:kept.join(pos?'+':'*')||(pos?'0':'1'),removed:t.vars.filter((_,i)=>pattern[i]==='-'),count:cells.length};
}
function renderMap(t){

  const maps=Array.from({length:2**layer},(_,part)=>`<div>${layer?`<p class="map-layer-label">${t.vars[0]} = ${part}</p>`:''}<div class="kmap ${n===3?'small':''}" style="grid-template-columns:38px repeat(${cols.length},minmax(42px,65px))"><div class="axis corner">${t.vars.slice(layer,layer+rowN).join('')}╲${t.vars.slice(layer+rowN).join('')}</div>${cols.map(c=>`<div class="axis">${Engine.bits(c,colN).join('')}</div>`).join('')}${rows.map(r=>`<div class="axis">${Engine.bits(r,rowN).join('')}</div>${cols.map(c=>{const i=part*2**(rowN+colN)+r*2**colN+c,v=t.values[i];return `<button class="map-cell ${v===1?'one':v==='X'?'dc':'zero'} ${S.selected.includes(i)?'selected':''}" data-cell="${i}" aria-pressed="${S.selected.includes(i)}" aria-label="m${i}, ${t.vars.join('')}=${Engine.bits(i,n).join('')}, F=${v}"><small>${i}</small>${v}</button>`;}).join('')}`).join('')}</div></div>`).join('');

    case'helpBtn':openModal('Ký hiệu & cách học',`<p><b>Chọn tự do:</b> thanh bên chia 22 bài thành 6 dạng. Số I / II phân biệt các bài bị đánh số lặp trong PDF. Mỗi hàm có hướng dẫn riêng, tổng cộng ${TOTAL} mục.</p><p><b>Đi nhanh:</b> bấm bước bất kỳ, hoặc “Nhanh +1 bước” để bỏ qua 1 bước trung gian, “+2 bước” để bỏ qua 2 bước trung gian. Không bị khóa bài.</p><p><b>Nhập công thức:</b> !A hay A' = NOT; AB hoặc A*B = AND; A+B = OR; A^B = XOR. Thứ tự ưu tiên: NOT → AND → XOR → OR. Dùng ngoặc nếu trộn XOR với OR. !(A+B) phủ cả ngoặc. Chấp nhận dấu !, ~, ¬, ·, &, ⊕.</p><p><b>Dạng chuẩn 1:</b> tổng các minterm (SOP). <b>Dạng chuẩn 2:</b> tích các maxterm (POS). Σm liệt kê hàng 1, ΠM liệt kê hàng 0, d liệt kê các đầu ra tùy chọn.</p><p><b>Thứ tự biến:</b> dùng đúng thứ tự hiển thị. Riêng bài 2-2 là C,B,A. Bit bên trái là bit có trọng số lớn nhất.</p><p><b>Tiến độ:</b> trả lời đúng ở bước Tự kiểm tra để đánh dấu hoàn thành. Tự lưu vào trình duyệt đang dùng; chuyển trình duyệt hay xóa dữ liệu sẽ không giữ được tiến độ.</p><p><b>Phạm vi:</b> chỉ chương 2, trang 5–9 của BTC2.pdf. Phần hướng dẫn do app triển khai từ đề; hình đề gốc được nhúng để đối chiếu. Đồ thị biểu diễn logic lý tưởng, không thêm độ trễ không có trong đề.</p>`);break;
  }
});
document.addEventListener('click',event=>{const row=event.target.closest('[data-row]');if(row){stop();S.frame=+row.dataset.row;renderVisual();}if(document.body.classList.contains('menu-open')&&!event.composedPath().some(n=>n.id==='sidebar'||n.id==='menuBtn'))document.body.classList.remove('menu-open');});
$('#scrubber').addEventListener('input',e=>{stop();S.frame=+e.target.value;applyFrame();});
document.addEventListener('change',e=>{if(e.target.id==='answerType')$('#answerInput').placeholder=e.target.value==='expr'?'Ví dụ: !A*B + C':'Ví dụ: 0, 2, 5 (tập rỗng: để trống)';});
document.addEventListener('keydown',e=>{if(e.target.id==='answerInput'&&e.key==='Enter'){checkAnswer();return;}if(e.target.closest('input,select,textarea')||$('#modal').open)return;if(e.key==='ArrowRight'){e.preventDefault();setStep(S.step+1);}if(e.key==='ArrowLeft'){e.preventDefault();setStep(S.step-1);}});
$('.brand').addEventListener('click',e=>{e.preventDefault();selectLesson(-1);});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
S.view=chooseView();S.pos=currentTask()?.prefer==='pos';render();
</script>
